schema_version: "1.0"
name: typo-fix
description: A one-word typo fix routes to haiku + effort-low.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/auto-route:auto-route Fix the typo 'recieve' -> 'receive' in README.md"
  max_turns: 4
  timeout_seconds: 150
  allowed_tools: [Skill]
graders:
  - name: agent-call-haiku-low
    type: tool_used
    tool: Agent
    input_match: '^(?=[\s\S]*"model"\s*:\s*"haiku")(?=[\s\S]*auto-route:effort-low)'
  - name: announces-route
    type: regex
    target: trace
    pattern: 'Route:\W*haiku\W*\+\W*(effort-)?low'
    flags: i
  - name: no-fable
    type: tool_used
    tool: Agent
    input_match: '"model"\s*:\s*"fable"'
    min: 0
    max: 0
