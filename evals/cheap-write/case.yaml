schema_version: "1.0"
name: cheap-write
description: Implementing a simple, fully specified function with tests present routes cheap-first (haiku, or sonnet + low/medium), not opus, with Route-meta phase=implement.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/auto-route:auto-route Implement slugify(text) in slugify.py: lowercase, replace runs of non-alphanumerics with a single hyphen, strip leading and trailing hyphens. test_slugify.py already has the tests; make them pass."
  max_turns: 4
  timeout_seconds: 150
  allowed_tools: [Skill]
graders:
  - name: agent-call-cheap-implement
    type: tool_used
    tool: Agent
    input_match: '^(?=[\s\S]*"model"\s*:\s*"(haiku|sonnet)")(?=[\s\S]*auto-route:effort-(low|medium))(?=[\s\S]*Route-meta:[^\n]*phase=implement)'
  - name: announces-route
    type: regex
    target: trace
    pattern: 'Route:\W*(haiku|sonnet)\W*\+\W*(auto-route:)?(effort-)?(low|medium)'
    flags: i
  - name: no-opus
    type: tool_used
    tool: Agent
    input_match: '"model"\s*:\s*"opus"'
    min: 0
    max: 0
  - name: no-fable
    type: tool_used
    tool: Agent
    input_match: '"model"\s*:\s*"fable"'
    min: 0
    max: 0
