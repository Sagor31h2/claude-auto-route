schema_version: "1.0"
name: explicit-override
description: An explicit "high:" prefix pins effort-high on a task the rubric would otherwise score low, and model stays rubric-scored (haiku) since it wasn't also pinned.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/auto-route:auto-route high: fix the typo 'recieve' -> 'receive' in README.md"
  max_turns: 4
  timeout_seconds: 150
  allowed_tools: [Skill]
graders:
  - name: agent-call-haiku-high
    type: tool_used
    tool: Agent
    input_match: '^(?=[\s\S]*"model"\s*:\s*"haiku")(?=[\s\S]*auto-route:effort-high)'
  - name: announces-explicit-pin
    type: regex
    target: trace
    pattern: 'Route:\W*haiku\W*\+\W*(effort-)?high\W*\(.*explicit.*pin'
    flags: i
  - name: no-fable
    type: tool_used
    tool: Agent
    input_match: '"model"\s*:\s*"fable"'
    min: 0
    max: 0
